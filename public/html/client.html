<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#30205c" />
    <title>Suporte</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="client_page">
    <main class="client_shell">
      <section
        id="chat_help"
        class="chat_card start_card"
        hidden
        aria-labelledby="start_title"
      >
        <header class="chat_header">
          <div>
            <p class="eyebrow">Atendimento</p>
            <h1 id="start_title">Como podemos ajudar?</h1>
          </div>
          <button
            id="start_cancel"
            class="icon_button"
            type="button"
            aria-label="Fechar"
          >
            ×
          </button>
        </header>
        <form id="start_chat_form" class="start_form">
          <label for="message_help">Conte um pouco sobre sua dúvida</label>
          <textarea
            id="message_help"
            name="text"
            maxlength="250"
            required
          ></textarea>
          <span class="charac_remaining"
            ><span id="charac_remaining">250</span> caracteres restantes</span
          >
          <label for="email">Seu e-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            maxlength="254"
            autocomplete="email"
            required
          />
          <p
            id="start_status"
            class="status"
            role="status"
            aria-live="polite"
          ></p>
          <button class="primary_button" type="submit">Iniciar conversa</button>
        </form>
      </section>

      <section
        id="chat_in_support"
        class="chat_card conversation_card"
        hidden
        aria-labelledby="conversation_title"
      >
        <header class="chat_header">
          <div>
            <p class="eyebrow">Atendimento</p>
            <h1 id="conversation_title">Conversa de suporte</h1>
          </div>
          <button
            id="chat_close"
            class="icon_button"
            type="button"
            aria-label="Minimizar conversa"
          >
            −
          </button>
        </header>
        <div id="messages" class="chat_messages" aria-live="polite"></div>
        <form id="send_message_form" class="message_send">
          <input
            type="text"
            name="message"
            id="message_user"
            maxlength="2000"
            placeholder="Escreva sua mensagem"
            aria-label="Mensagem"
            required
          />
          <button class="primary_button" type="submit">Enviar</button>
        </form>
        <p
          id="conversation_status"
          class="status"
          role="status"
          aria-live="polite"
        ></p>
      </section>

      <button class="btn_support" id="btn_support" type="button">
        <img src="/images/chat.png" alt="" />
        <span>Falar com suporte</span>
      </button>
    </main>
    <script src="/socket.io/socket.io.js" defer></script>
    <script src="/js/chat.js" defer></script>
  </body>
</html>
