<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#30205c" />
    <title>Atendimento · Central de suporte</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="admin_page">
    <main class="admin_shell">
      <section
        id="admin_login"
        class="login_card"
        aria-labelledby="login_title"
      >
        <p class="eyebrow">Central de suporte</p>
        <h1 id="login_title">Acesso do atendente</h1>
        <p>
          Entre com as credenciais administrativas configuradas neste servidor.
        </p>
        <form id="admin_login_form" class="login_form">
          <label for="admin_username">Usuário</label>
          <input
            id="admin_username"
            name="username"
            autocomplete="username"
            required
          />
          <label for="admin_password">Senha</label>
          <input
            id="admin_password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
          <button class="primary_button" type="submit">Entrar</button>
        </form>
        <p
          id="login_status"
          class="status"
          role="status"
          aria-live="polite"
        ></p>
      </section>

      <section id="admin_workspace" class="workspace" hidden>
        <header class="workspace_header">
          <div>
            <p class="eyebrow">Central de suporte</p>
            <h1>Conversas</h1>
          </div>
          <button id="admin_logout" class="secondary_button" type="button">
            Sair
          </button>
        </header>
        <p id="page_status" class="status" role="status" aria-live="polite"></p>
        <div class="conversation_layout">
          <section class="inbox" aria-labelledby="inbox_title">
            <h2 id="inbox_title">Caixa de entrada</h2>
            <div id="list_users" class="user_list"></div>
          </section>
          <section
            id="supports"
            class="conversation_area"
            aria-label="Atendimento selecionado"
          >
            <p class="empty_state">Selecione uma conversa para começar.</p>
          </section>
        </div>
      </section>
    </main>
    <script src="/socket.io/socket.io.js" defer></script>
    <script src="/js/admin.js" defer></script>
  </body>
</html>
